<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333" />
    </marker>
    <style>
      .box { fill:#f8f8f8; stroke:#333; stroke-width:2; }
      .title { font: bold 18px sans-serif; fill:#111; }
      .label { font: 14px sans-serif; fill:#111; }
      .line { stroke:#333; stroke-width:2; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="320" y="20" width="260" height="90" rx="12" ry="12" />
  <text x="450" y="55" text-anchor="middle" class="title">ATmega32A</text>
  <text x="450" y="78" text-anchor="middle" class="label">Core controller</text>
  
  <rect class="box" x="40" y="140" width="240" height="90" rx="12" ry="12" />
  <text x="160" y="180" text-anchor="middle" class="title">Analog Inputs</text>
  <text x="160" y="205" text-anchor="middle" class="label">ADC0..ADC3</text>
  
  <rect class="box" x="620" y="140" width="240" height="90" rx="12" ry="12" />
  <text x="740" y="180" text-anchor="middle" class="title">Operator Panel</text>
  <text x="740" y="205" text-anchor="middle" class="label">Buttons, LEDs, LCD</text>
  
  <rect class="box" x="40" y="300" width="240" height="90" rx="12" ry="12" />
  <text x="160" y="340" text-anchor="middle" class="title">PWM Drive</text>
  <text x="160" y="365" text-anchor="middle" class="label">H-Bridge / Motor</text>
  
  <rect class="box" x="620" y="300" width="240" height="90" rx="12" ry="12" />
  <text x="740" y="340" text-anchor="middle" class="title">Memory & Comm</text>
  <text x="740" y="365" text-anchor="middle" class="label">SPI EEPROM + USART</text>
  
  <line class="line" x1="300" y1="65" x2="320" y2="65" />
  <line class="line" x1="560" y1="65" x2="580" y2="65" />
  
  <line class="line" x1="160" y1="230" x2="160" y2="300" />
  <text x="120" y="270" class="label">ADC</text>
  
  <line class="line" x1="740" y1="230" x2="740" y2="300" />
  <text x="760" y="270" class="label">I2C / GPIO</text>
  
  <line class="line" x1="160" y1="390" x2="160" y2="410" />
  <text x="120" y="405" class="label">PWM</text>
  <line class="line" x1="740" y1="390" x2="740" y2="410" />
  <text x="760" y="405" class="label">SPI / UART</text>
  
  <path class="line" d="M320,155 C320,155 330,200 320,240" />
  <path class="line" d="M580,155 C580,155 570,200 580,240" />
  <path class="line" d="M320,360 C320,360 330,400 320,420" />
  <path class="line" d="M580,360 C580,360 570,400 580,420" />
</svg>
